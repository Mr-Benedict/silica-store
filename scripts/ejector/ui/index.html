<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejector</title>
  <!-- Sibling files, served over silica:// alongside this page. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <span class="dot off" id="statusDot"></span>
      <h1 id="title">Ejector</h1>
      <span class="sub" id="sub"></span>
    </header>

    <section id="offline" class="offline">
      <p id="offlineMsg">Searching for an ejector…</p>
    </section>

    <section id="live" class="live hidden">
      <div class="col">
        <ul id="list" class="list"></ul>
        <!-- The only scrolling that works on every surface: a wall screen forwards no wheel event. -->
        <div class="pager">
          <button class="pg" type="button" id="lUp">&#9650;</button>
          <span class="pgpos" id="lPos">0/0</span>
          <button class="pg" type="button" id="lDn">&#9660;</button>
        </div>

        <div class="tank" id="tank">
          <span class="tlabel">Tank</span>
          <span class="tname" id="tankFluid">Empty</span>
          <div class="ttrack"><div class="tfill" id="tankFill"></div></div>
          <span class="tamt" id="tankAmt">0 / 0 mB</span>
        </div>
      </div>

      <aside class="side">
        <section class="filter">
          <h2>Filter</h2>
          <div id="filterList" class="flist"></div>
          <div class="pager">
            <button class="pg" type="button" id="fUp">&#9650;</button>
            <span class="pgpos" id="fPos">0/0</span>
            <button class="pg" type="button" id="fDn">&#9660;</button>
          </div>
        </section>

        <div class="controls">
          <button class="btn" id="modeBtn">Mode: blacklist</button>
          <button class="btn primary" id="ejectBtn">Force eject</button>
        </div>
      </aside>
    </section>

    <!-- Status card, mirroring the `detector` app's: the last control action and how it went. It sits
         OUTSIDE both sections so it is readable while the offline card holds the sheet, and it is a
         fixed-height row of the page flex column so it never needs scrolling to reach — a wall screen
         forwards no wheel event (see the pager comment above). -->
    <div class="statusbar">
      <span class="st-lamp" id="stLamp"></span>
      <span class="st-txt" id="stTxt">Standing by — no operator action yet.</span>
    </div>
  </main>
  <script src="client.js"></script>
</body>
</html>
