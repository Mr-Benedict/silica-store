name: catalog

# Two jobs, deliberately separate:
#   - a pull request is only ever VALIDATED. It never writes and never commits.
#   - a push to main regenerates index.json and commits it back, with [skip ci] in the message
#     so the commit cannot trigger this workflow again.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the catalog
        run: node tools/build-index.mjs --check

  publish:
    name: regenerate index.json
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialise pushes to the same ref: two concurrent runs would race on `git push`.
    concurrency:
      group: catalog-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and regenerate index.json
        run: node tools/build-index.mjs --write
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'silica-store-bot'
          git config user.email 'silica-store-bot@users.noreply.github.com'
          git add index.json
          git commit -m 'ci: regenerate index.json [skip ci]'
          git push
